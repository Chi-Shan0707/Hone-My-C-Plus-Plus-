<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      text { font-family: monospace; font-size: 14px; text-anchor: middle;}
      .node { stroke: #333; stroke-width: 2; r: 25; }
      .node text { fill: #000; font-weight: bold; }
      .edge { stroke: #555; stroke-width: 2; }
      .label { fill: #555; font-size: 12px; }
      .arrow { fill: none; stroke: #e74c3c; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>

  <!-- Left Side: Unbalanced (Right-Right Case) -->
  <g transform="translate(150, 50)">
    <text x="100" y="-20" font-size="16" font-weight="bold">Unbalanced (Right Heavy)</text>
    
    <!-- Node A -->
    <circle cx="100" cy="50" class="node" fill="#fff" />
    <text x="100" y="55">A</text>
    
    <!-- Edge A->B -->
    <line x1="100" y1="75" x2="160" y2="125" class="edge" />
    
    <!-- Node B -->
    <circle cx="160" cy="150" class="node" fill="#fff" />
    <text x="160" y="155">B</text>

    <!-- Edge B->C -->
    <line x1="160" y1="175" x2="200" y2="225" class="edge" />
    
    <!-- Node C -->
    <circle cx="200" cy="250" class="node" fill="#fff" />
    <text x="200" y="255">C</text>
    
    <!-- Subtrees -->
    <text x="60" y="100" class="label">T1</text>
    <line x1="75" y1="75" x2="50" y2="120" class="edge" stroke-dasharray="4"/>
    
    <text x="120" y="200" class="label">T2</text>
    <line x1="135" y1="175" x2="120" y2="220" class="edge" stroke-dasharray="4"/>
    
    <text x="240" y="300" class="label">T3</text>
    <line x1="225" y1="275" x2="240" y2="320" class="edge" stroke-dasharray="4"/>
  </g>

  <!-- Arrow: Left Rotate -->
  <g transform="translate(350, 150)">
    <path d="M 20 20 Q 50 -10 80 20" class="arrow" />
    <text x="50" y="50" fill="#e74c3c">Left Rotate (A)</text>
  </g>

  <!-- Right Side: Balanced -->
  <g transform="translate(550, 50)">
    <text x="100" y="-20" font-size="16" font-weight="bold">Balanced (New Root B)</text>
    
    <!-- Node B (Root) -->
    <circle cx="100" cy="50" class="node" fill="#f0fff0" stroke="#2ecc71" /> 
    <text x="100" y="55">B</text>
    
    <!-- Edge B->A -->
    <line x1="100" y1="75" x2="40" y2="125" class="edge" />
    
    <!-- Node A -->
    <circle cx="40" cy="150" class="node" fill="#fff" />
    <text x="40" y="155">A</text>

    <!-- Edge B->C -->
    <line x1="100" y1="75" x2="160" y2="125" class="edge" />
    
    <!-- Node C -->
    <circle cx="160" cy="150" class="node" fill="#fff" />
    <text x="160" y="155">C</text>

    <!-- Subtrees -->
    <text x="10" y="200" class="label">T1</text>
    <line x1="15" y1="175" x2="10" y2="220" class="edge" stroke-dasharray="4"/>

    <text x="70" y="200" class="label">T2</text>
    <line x1="65" y1="175" x2="70" y2="220" class="edge" stroke-dasharray="4"/>
    
    <text x="190" y="200" class="label">T3</text>
    <line x1="185" y1="175" x2="190" y2="220" class="edge" stroke-dasharray="4"/>
  </g>
  
  <text x="400" y="350" font-size="16" font-style="italic">
    "Pull 'B' up, 'A' falls down to left, T2 moves from B-Left to A-Right"
  </text>
</svg>
