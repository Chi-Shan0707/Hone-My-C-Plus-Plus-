<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewbox="0 0 800 400">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 20px; font-weight: bold; }
      .small { font-size: 12px; }
      .arrow { stroke: #000; stroke-width: 2; marker-end: url(#arrowhead); }
      .box { fill: #f0f8ff; stroke: #4682b4; stroke-width: 2; rx: 10; ry: 10; }
      .box-highlight { fill: #ffe4e1; stroke: #cd5c5c; stroke-width: 2; rx: 10; ry: 10; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">FFT Process: From Time Domain to Frequency Domain</text>

  <!-- Step 1: Polynomial Representation -->
  <rect x="50" y="80" width="180" height="60" class="box" />
  <text x="140" y="105" text-anchor="middle" font-weight="bold">Digits (Coefficient)</text>
  <text x="140" y="125" text-anchor="middle" class="small">A = [1, 2, 3...]</text>
  <text x="140" y="135" text-anchor="middle" class="small">Standard Multiplication O(N²)</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="110" x2="290" y2="110" class="arrow" />
  <text x="260" y="100" text-anchor="middle" class="small" fill="blue">FFT (DFT)</text>

  <!-- Step 2: Point-Value Representation -->
  <rect x="310" y="80" width="180" height="60" class="box-highlight" />
  <text x="400" y="105" text-anchor="middle" font-weight="bold">Point Values</text>
  <text x="400" y="125" text-anchor="middle" class="small">Eval at roots of unity</text>
  <text x="400" y="135" text-anchor="middle" class="small">A(ω), B(ω)</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="140" x2="400" y2="190" class="arrow" />
  <text x="410" y="170" text-anchor="start" class="small" fill="green">Pointwise Mul O(N)</text>

  <!-- Step 3: Product in Frequency Domain -->
  <rect x="310" y="200" width="180" height="60" class="box-highlight" />
  <text x="400" y="225" text-anchor="middle" font-weight="bold">Product Values</text>
  <text x="400" y="245" text-anchor="middle" class="small">C(ω) = A(ω) * B(ω)</text>

  <!-- Arrow 3 -->
  <line x1="310" y1="230" x2="250" y2="230" class="arrow" />
  <text x="280" y="220" text-anchor="middle" class="small" fill="blue">IFFT (IDFT)</text>

  <!-- Step 4: Result -->
  <rect x="50" y="200" width="180" height="60" class="box" />
  <text x="140" y="225" text-anchor="middle" font-weight="bold">Coefficients (Result)</text>
  <text x="140" y="245" text-anchor="middle" class="small">C = [c0, c1, ...]</text>
  
  <!-- Comparison Text -->
  <text x="400" y="320" text-anchor="middle" font-size="14">
    <tspan x="400" dy="0">Time Domain: Convolution is hard (O(N²))</tspan>
    <tspan x="400" dy="20">Frequency Domain: Multiplication is simple (O(N))</tspan>
    <tspan x="400" dy="20">FFT Bridge: Fast conversion (O(N log N))</tspan>
  </text>
</svg>
