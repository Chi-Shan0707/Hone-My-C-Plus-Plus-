<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewbox="0 0 600 400">
  <defs>
    <style>
      text { font-family: monospace; font-size: 14px; }
      .circle { fill: #f0f8ff; stroke: #4682b4; stroke-width: 2; r: 20; }
      .line { stroke: #000; stroke-width: 2; }
      .dashed { stroke: #888; stroke-width: 2; stroke-dasharray: 5,5; }
    </style>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="20">Butterfly Operation (Basic Unit)</text>

  <!-- Input Nodes -->
  <circle cx="100" cy="100" r="20" class="circle" />
  <text x="100" y="105" text-anchor="middle">u</text>
  <text x="60" y="105" text-anchor="end">a[k]</text>

  <circle cx="100" cy="300" r="20" class="circle" />
  <text x="100" y="305" text-anchor="middle">v</text>
  <text x="60" y="305" text-anchor="end">a[k+m]</text>

  <!-- Wn factor -->
  <text x="160" y="290" text-anchor="middle" font-size="12">ω</text>
  <line x1="120" y1="300" x2="200" y2="300" class="line" />

  <!-- Connecting Lines -->
  <!-- Top Output: u + ωv -->
  <line x1="120" y1="100" x2="400" y2="100" class="line" /> <!-- straight u path -->
  <line x1="200" y1="300" x2="400" y2="100" class="dashed" /> <!-- cross v path -->

  <!-- Bottom Output: u - ωv -->
  <line x1="120" y1="100" x2="400" y2="300" class="dashed" /> <!-- cross u path -->
  <line x1="200" y1="300" x2="400" y2="300" class="line" /> <!-- straight v path -->

  <!-- Output Nodes -->
  <circle cx="420" cy="100" r="20" class="circle" fill="#ffe4e1" stroke="#cd5c5c" />
  <text x="420" y="105" text-anchor="middle">U</text>
  <text x="460" y="105" text-anchor="start">= u + ω*v</text>

  <circle cx="420" cy="300" r="20" class="circle" fill="#ffe4e1" stroke="#cd5c5c" />
  <text x="420" y="305" text-anchor="middle">V</text>
  <text x="460" y="305" text-anchor="start">= u - ω*v</text>

  <text x="300" y="380" text-anchor="middle" font-size="12">
    In-place update: a[k] = U, a[k+m] = V
  </text>
</svg>
